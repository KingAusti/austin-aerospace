# ─────────────────────────────────────────────────
#  Deep Forest Gruvbox — AeroSpace Config
# ─────────────────────────────────────────────────

start-at-login = true

# Launch SketchyBar after AeroSpace starts
after-startup-command = ['exec-and-forget sketchybar']

# Notify SketchyBar on every workspace change
exec-on-workspace-change = [
  '/bin/bash', '-c',
  'sketchybar --trigger aerospace_workspace_change FOCUSED_WORKSPACE=$AEROSPACE_FOCUSED_WORKSPACE'
]

# ── Layout ──────────────────────────────────────
default-root-container-layout = 'tiles'
default-root-container-orientation = 'auto'
accordion-padding = 30

enable-normalization-flatten-containers = true
enable-normalization-opposite-orientation-for-nested-containers = true

# ── Gaps ────────────────────────────────────────
[gaps]
inner.horizontal = 6
inner.vertical   = 6
outer.left       = 6
outer.right      = 6
outer.top        = 6
outer.bottom     = 6

# ── Main Mode Keybindings ────────────────────────
[mode.main.binding]

# Focus
alt-h = 'focus left'
alt-j = 'focus down'
alt-k = 'focus up'
alt-l = 'focus right'

# Move window
alt-shift-h = 'move left'
alt-shift-j = 'move down'
alt-shift-k = 'move up'
alt-shift-l = 'move right'

# Resize (10px steps)
alt-ctrl-h = 'resize width -50'
alt-ctrl-l = 'resize width +50'
alt-ctrl-k = 'resize height -50'
alt-ctrl-j = 'resize height +50'

# Workspaces
alt-1 = 'workspace 1'
alt-2 = 'workspace 2'
alt-3 = 'workspace 3'
alt-4 = 'workspace 4'
alt-5 = 'workspace 5'
alt-6 = 'workspace 6'
alt-7 = 'workspace 7'
alt-8 = 'workspace 8'
alt-9 = 'workspace 9'

# Move window to workspace (and follow)
alt-shift-1 = ['move-node-to-workspace 1', 'workspace 1']
alt-shift-2 = ['move-node-to-workspace 2', 'workspace 2']
alt-shift-3 = ['move-node-to-workspace 3', 'workspace 3']
alt-shift-4 = ['move-node-to-workspace 4', 'workspace 4']
alt-shift-5 = ['move-node-to-workspace 5', 'workspace 5']
alt-shift-6 = ['move-node-to-workspace 6', 'workspace 6']
alt-shift-7 = ['move-node-to-workspace 7', 'workspace 7']
alt-shift-8 = ['move-node-to-workspace 8', 'workspace 8']
alt-shift-9 = ['move-node-to-workspace 9', 'workspace 9']

# Utilities
alt-enter     = 'exec-and-forget open -n /Applications/Ghostty.app'
alt-shift-f   = 'fullscreen'
alt-tab       = 'workspace-back-and-forth'
alt-shift-tab = 'move-workspace-to-monitor --wrap-around next'

# Enter service mode
alt-shift-semicolon = 'mode service'

# ── Service Mode ─────────────────────────────────
[mode.service.binding]
# esc: reload config and return to main mode
esc = ['reload-config', 'mode main']
# r: flatten/reset workspace layout
r   = ['flatten-workspace-tree', 'mode main']
# f: toggle floating for focused window
f   = ['layout floating tiling', 'mode main']

# ── App → Workspace Assignments ──────────────────
[[on-window-detected]]
if.app-name-regex-substring = 'Ghostty'
run = 'move-node-to-workspace 1'

[[on-window-detected]]
if.app-name-regex-substring = 'Dia'
run = 'move-node-to-workspace 2'

[[on-window-detected]]
if.app-name-regex-substring = 'Proton Mail'
run = 'move-node-to-workspace 3'

[[on-window-detected]]
if.app-name-regex-substring = 'Signal'
run = 'move-node-to-workspace 4'

[[on-window-detected]]
if.app-name-regex-substring = 'Messages'
run = 'move-node-to-workspace 5'

[[on-window-detected]]
if.app-name-regex-substring = 'Finder'
run = 'layout floating'
